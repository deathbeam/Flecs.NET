name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      push-packages:
        description: 'Push nuget packages'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
            natives: win-x64 win-arm64
          - os: macos-15
            natives: >-
              linux-x64 linux-arm64 osx-x64 osx-arm64 browser-wasm
              iossimulator-x64 iossimulator-arm64 ios-arm64 android-arm64 android-x64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup IOS SDK
        if: matrix.os == 'macos-15'
        run: |
          echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "IOS_SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)" >> $GITHUB_ENV

      - name: Setup Emscripten SDK
        if: matrix.os == 'macos-15'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '5.0.6'
          actions-cache-folder: 'emsdk-cache'

      - name: Setup Android NDK
        if: matrix.os == 'macos-15'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          link-to-sdk: true

      - name: Set Android NDK variables
        if: matrix.os == 'macos-15'
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Restore Dependencies
        run: dotnet restore

      - name: Generate Bindings
        run: dotnet run --project src/Flecs.NET.Bindgen

      - name: Build Projects
        run: |
          dotnet build -c Debug
          dotnet build -c Release

      - name: Run Tests
        run: dotnet test -p:SkipNatives=true

      - name: Build Natives
        if: matrix.natives
        working-directory: src/Flecs.NET.Native
        run: |
          for config in Debug Release; do
            for rid in ${{ matrix.natives }}; do
              dotnet build -c $config -r $rid
            done
          done

      - name: Upload Natives
        if: matrix.natives
        uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.os }}
          path: src/Flecs.NET.Native/bin/*/runtimes/**
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      packages: write

    env:
      PUSH: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.push-packages == 'true') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Validate Tag Version
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' src/Directory.Build.props)
          if [ "$version" != "$prefix" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $prefix in src/Directory.Build.props"
            exit 1
          fi

      - name: Set Version Suffix
        if: github.ref_type != 'tag'
        run: echo "FlecsVersionSuffix=build.$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Generate Bindings
        run: dotnet run --project src/Flecs.NET.Bindgen

      - name: Download Natives
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: src/Flecs.NET.Native/bin
          merge-multiple: true

      - name: Pack Nuget Packages
        run: |
          dotnet pack -p:VersionSuffix=$FlecsVersionSuffix -p:FlecsPackPdb=true -p:SkipNatives=true -c Debug -o artifacts/nuget
          dotnet pack -p:VersionSuffix=$FlecsVersionSuffix -p:FlecsPackPdb=true -p:SkipNatives=true -c Release -o artifacts/nuget

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nuget Packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: Push GitHub Packages
        if: env.PUSH == 'true'
        run: dotnet nuget push 'artifacts/nuget/*.nupkg' --skip-duplicate --api-key '${{ secrets.GITHUB_TOKEN }}' --source 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json'

      - name: NuGet login
        if: env.PUSH == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: deathbeam

      - name: Push NuGet Packages
        if: env.PUSH == 'true'
        run: dotnet nuget push 'artifacts/nuget/*.nupkg' --skip-duplicate --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --source 'https://api.nuget.org/v3/index.json'

      - name: Upload Release Assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/nuget/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/nuget/* --generate-notes
          fi
